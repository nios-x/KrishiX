    <title>Krishi360 | AI Precision Agriculture Platform</title>
    <meta name="description" content="AI-driven precision agriculture platform for Indian farmers integrating soil intelligence, crop disease computer vision, and historical production analytics." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&family=Raleway:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <!--
      DIRECTION · THE DETERMINATION SHEET
      A herbarium sheet is the original cooperative record: many hands annotate
      one specimen across decades and none of them owns it. Archival mount board
      (cool bone), herbarium-cabinet ink, accession vermillion, determination
      viridian, pressed-leaf olive. Ruled registration lines, mounted label
      paper, typed mono labels, layered annotation slips held by mounting tape.
      Cut edges, never rounded chrome. Raleway determines, Geist labels,
      Geist Mono measures.
    -->
    <script>
      /* The lay-down needs to know it may hide content before it settles it
         back. Without JS the class never lands and everything stays visible. */
      try {
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.documentElement.dataset.motion = 'on';
        }
      } catch (e) {}
      /* Paint the board in the stored theme before first paint, so the sheet
         never flashes light on a dark-mode reload. */
      try {
        if (localStorage.getItem('krishi360_theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
